<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Private Access</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
        
        html, body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f8f9fa;
            touch-action: manipulation;
        }

        /* Prevents automatic zoom on mobile input focus */
        input {
            font-size: 16px !important;
        }

        /* Shake animation for wrong password */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        .shake {
            animation: shake 0.4s ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-[420px] bg-white rounded-3xl border border-gray-100 shadow-sm p-6 sm:p-8 transition-all duration-300">
        
        <!-- Header Section -->
        <div class="text-center mb-6 space-y-2">
            <!-- Subtitle -->
            <p class="text-[12px] font-semibold tracking-widest text-gray-500 uppercase">
                PRIVATE ACCESS
            </p>
            
            <!-- Main Title -->
            <h1 class="text-2xl font-bold text-gray-900 tracking-tight">
                코드를 입력하세요
            </h1>
            
            <!-- Description -->
            <p class="text-[13px] text-gray-500 leading-relaxed px-2">
                4자리 숫자 코드를 입력하면 숨겨진 이미지를 확인 할 수 있어요.
            </p>
        </div>

        <!-- Locked View (Form Input) -->
        <div id="lockedView" class="space-y-4">
            <div>
                <label for="passcode" class="block text-xs font-semibold text-gray-700 mb-2">
                    숫자 코드
                </label>
                <input 
                    type="password" 
                    id="passcode" 
                    maxlength="4" 
                    placeholder="••••" 
                    inputmode="numeric"
                    class="w-full px-4 py-3 text-center text-lg border border-gray-200 rounded-xl focus:outline-none focus:border-gray-900 focus:ring-1 focus:ring-gray-900 placeholder-gray-300 transition-all"
                    onkeypress="if(event.key === 'Enter') checkCode()"
                >
                <p id="hintText" class="mt-2 text-center text-xs text-gray-500 transition-colors duration-200">
                    숫자 4자리를 입력해 주세요.
                </p>
            </div>

            <button 
                onclick="checkCode()" 
                class="w-full py-3.5 bg-[#0f172a] hover:bg-black text-white text-sm font-medium rounded-xl transition-all duration-200 active:scale-[0.99] shadow-sm"
            >
                확인
            </button>
        </div>

        <!-- Unlocked View (Hidden Content) -->
        <div id="unlockedView" class="hidden space-y-5 text-center transition-all duration-300">
            <!-- Success Status Message -->
            <p class="text-xs font-bold text-emerald-700 tracking-tight">
                잠금이 해제되었습니다.
            </p>

            <!-- Unlocked Image Container -->
            <div class="relative w-full overflow-hidden rounded-2xl bg-gray-100">
                <img 
                    src="8e98d1f85_secret-image.png" 
                    alt="숨겨진 이미지" 
                    class="w-full h-auto rounded-2xl block object-cover"
                    onerror="this.onerror=null; this.src='https://placehold.co/600x450/e2e8f0/475569?text=8e98d1f85_secret-image.png';"
                >
            </div>

            <!-- Lock Again Button -->
            <button 
                onclick="lockAgain()" 
                class="w-full py-3 border border-gray-200 hover:bg-gray-50 text-gray-700 text-xs font-medium rounded-xl transition-all duration-200"
            >
                다시 잠그기
            </button>
        </div>

    </div>

    <script>
        const CORRECT_CODE = "0407";

        function checkCode() {
            const input = document.getElementById("passcode");
            const hint = document.getElementById("hintText");
            const lockedView = document.getElementById("lockedView");
            const unlockedView = document.getElementById("unlockedView");

            if (input.value === CORRECT_CODE) {
                // Correct Password Logic
                lockedView.classList.add("hidden");
                unlockedView.classList.remove("hidden");
                
                // Reset errors
                input.classList.remove("border-red-500", "shake");
                hint.innerText = "숫자 4자리를 입력해 주세요.";
                hint.className = "mt-2 text-center text-xs text-gray-500";
            } else {
                // Incorrect Password Logic
                input.classList.add("border-red-500", "shake");
                hint.innerText = "코드가 일치하지 않습니다. 다시 입력해 주세요.";
                hint.className = "mt-2 text-center text-xs text-red-500 font-medium";
                
                // Remove shake class after animation completes
                setTimeout(() => {
                    input.classList.remove("shake");
                }, 400);

                input.value = "";
                input.focus();
            }
        }

        function lockAgain() {
            const input = document.getElementById("passcode");
            const hint = document.getElementById("hintText");
            const lockedView = document.getElementById("lockedView");
            const unlockedView = document.getElementById("unlockedView");

            // Reset Form State
            input.value = "";
            hint.innerText = "숫자 4자리를 입력해 주세요.";
            hint.className = "mt-2 text-center text-xs text-gray-500";
            input.classList.remove("border-red-500");

            // Switch view
            unlockedView.classList.add("hidden");
            lockedView.classList.remove("hidden");
            
            input.focus();
        }
    </script>
</body>
</html>
